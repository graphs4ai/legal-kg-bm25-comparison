[project]
name = "legal-kg-bm25-comparison"
version = "0.1.0"
description = "A versioned legal knowledge graph of Brazilian federal legislation, compared with flat BM25 retrieval on the Brazilian bar exam"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pandas (>=3.0.1,<4.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "openai (>=2.36.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "tabulate (>=0.10.0,<0.11.0)",
    "tdqm (>=0.0.1,<0.0.2)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "sentence-transformers (>=3.0.0,<6.0.0)",
    "pydantic (>=2.10.0,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "pdfplumber (>=0.11.10,<0.12.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
